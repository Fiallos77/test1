<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gatito interactivo</title>
<style>
  :root {
    --bg: #1a1a1a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .stage {
    position: relative;
    width: min(90vw, 420px);
    aspect-ratio: 736 / 1104;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    cursor: pointer;
  }

  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.15s ease-out;
  }

  .pupil {
    position: absolute;
    width: 3.6%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #1a0f05;
    mix-blend-mode: multiply;
    transform: translate(-50%, -50%);
    transition: left 0.05s linear, top 0.05s linear;
    pointer-events: none;
  }

  /* posiciones base, en % del contenedor, sobre el centro de cada pupila */
  .pupil-left  { left: 43.75%; top: 35.51%; }
  .pupil-right { left: 61.41%; top: 35.51%; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <img id="poster" src="gato.jpeg" alt="Gatito con capucha amarilla">
  <div class="pupil pupil-left" id="pupilLeft"></div>
  <div class="pupil pupil-right" id="pupilRight"></div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const poster = document.getElementById('poster');
  const pupilLeft = document.getElementById('pupilLeft');
  const pupilRight = document.getElementById('pupilRight');

  // Posicion base de cada pupila, en fraccion del ancho/alto del stage.
  const eyes = [
    { el: pupilLeft,  baseX: 0.4375, baseY: 0.3551 },
    { el: pupilRight, baseX: 0.6141, baseY: 0.3551 }
  ];

  // Cuanto se puede mover la pupila dentro del ojo, en fraccion del ancho
  // del stage. Mantenlo chico para que no se salga del iris.
  const MAX_OFFSET = 0.012;

  // Cuanto se inclina la imagen completa como efecto extra, en grados.
  const MAX_TILT = 3;

  function setEyes(dx, dy) {
    eyes.forEach(({ el, baseX, baseY }) => {
      const x = (baseX + dx) * 100;
      const y = (baseY + dy) * 100;
      el.style.left = x + '%';
      el.style.top = y + '%';
    });
  }

  function resetEyes() {
    eyes.forEach(({ el, baseX, baseY }) => {
      el.style.left = (baseX * 100) + '%';
      el.style.top = (baseY * 100) + '%';
    });
    poster.style.transform = 'rotate(0deg) scale(1)';
  }

  stage.addEventListener('mousemove', (e) => {
    const rect = stage.getBoundingClientRect();
    const nx = (e.clientX - rect.left) / rect.width - 0.5;  // -0.5..0.5
    const ny = (e.clientY - rect.top) / rect.height - 0.5;  // -0.5..0.5

    setEyes(nx * MAX_OFFSET * 2, ny * MAX_OFFSET * 2);

    const tilt = nx * MAX_TILT;
    poster.style.transform = 'rotate(' + tilt + 'deg) scale(1.02)';
  });

  stage.addEventListener('mouseleave', resetEyes);
})();
</script>

</body>
</html>

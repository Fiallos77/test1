<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gatito interactivo</title>
<style>
  :root {
    --bg: #1a1a1a;
    --card-bg: #f5a623;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .stage {
    position: relative;
    width: min(90vw, 420px);
    aspect-ratio: 9 / 16;
    border-radius: 24px;
    overflow: hidden;
    background: var(--card-bg);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    cursor: pointer;
  }

  .stage img,
  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .stage img {
    z-index: 2;
    opacity: 1;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .stage video {
    z-index: 1;
    transform-origin: center;
  }

  .stage.is-active img {
    opacity: 0;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <img id="poster" src="gato.jpeg" alt="Gatito con capucha amarilla">
  <video id="video" src="video.mp4" muted playsinline preload="auto"></video>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const video = document.getElementById('video');

  // El video hace un solo arco: centro -> gira hacia un lado -> vuelve al
  // centro. El pico de giro queda a la mitad de la duracion. Para simular
  // que la mirada sigue el mouse en ambos sentidos, usamos la distancia
  // absoluta al centro para elegir el tiempo, y volteamos el video con
  // CSS cuando el mouse esta del lado contrario al que gira el personaje
  // de forma natural.

  let duration = 4;
  let peakTime = 2;
  let targetTime = 0;
  let currentTime = 0;
  let targetFlip = 1;
  let raf = null;
  let active = false;

  video.addEventListener('loadedmetadata', () => {
    duration = video.duration || 4;
    peakTime = duration / 2;
    video.currentTime = 0;
  });

  function loop() {
    const diff = targetTime - currentTime;
    currentTime += diff * 0.18;

    if (Math.abs(diff) < 0.001) {
      currentTime = targetTime;
    }

    if (Number.isFinite(currentTime)) {
      video.currentTime = currentTime;
    }

    video.style.transform = 'scaleX(' + targetFlip + ')';

    if (active || Math.abs(targetTime - currentTime) > 0.001) {
      raf = requestAnimationFrame(loop);
    } else {
      raf = null;
    }
  }

  function ensureLoop() {
    if (!raf) {
      raf = requestAnimationFrame(loop);
    }
  }

  function handleMove(e) {
    const rect = stage.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const ratio = Math.min(Math.max(x / rect.width, 0), 1) * 2 - 1; // -1..1
    const absRatio = Math.abs(ratio);

    targetTime = absRatio * peakTime;
    // El personaje gira de forma natural hacia un lado a medida que avanza
    // el tiempo. Si el mouse esta del lado contrario, volteamos el video
    // para que la cabeza parezca girar hacia el mouse.
    targetFlip = ratio > 0 ? -1 : 1;

    ensureLoop();
  }

  stage.addEventListener('mouseenter', () => {
    active = true;
    stage.classList.add('is-active');
    ensureLoop();
  });

  stage.addEventListener('mousemove', handleMove);

  stage.addEventListener('mouseleave', () => {
    active = false;
    targetTime = 0;
    targetFlip = 1;
    stage.classList.remove('is-active');
    ensureLoop();
  });
})();
</script>

</body>
</html>

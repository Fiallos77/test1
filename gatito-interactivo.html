<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gatito interactivo</title>
<style>
  :root {
    --bg: #1a1a1a;
    --card-bg: #f5a623;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .stage {
    position: relative;
    width: min(90vw, 420px);
    aspect-ratio: 9 / 16;
    border-radius: 24px;
    overflow: hidden;
    background: var(--card-bg);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    cursor: pointer;
  }

  .stage img,
  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .stage img {
    z-index: 2;
    opacity: 1;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .stage video {
    z-index: 1;
    transform-origin: center;
  }

  .stage.is-active img {
    opacity: 0;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <img id="poster" src="gato.jpeg" alt="Gatito con capucha amarilla">
  <video id="video" src="video.mp4" muted playsinline preload="auto"></video>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const video = document.getElementById('video');

  // El video hace un solo arco: centro -> gira hacia un lado -> vuelve al
  // centro. Usamos la distancia absoluta al centro del mouse para elegir
  // el tiempo, y volteamos el video con CSS para simular el giro hacia
  // el lado contrario.
  //
  // Los seeks de video son asincronos. Si se pide un nuevo currentTime
  // mientras el anterior todavia no termina (evento 'seeked'), el video
  // se puede quedar atascado y dejar de responder. Por eso encolamos un
  // unico "proximo tiempo pendiente" y solo lo aplicamos cuando el video
  // confirma que termino el seek anterior.

  let duration = 4;
  let peakTime = 2;
  let pendingTime = null;
  let isSeeking = false;

  video.addEventListener('loadedmetadata', () => {
    duration = video.duration || 4;
    peakTime = duration / 2;
  });

  function doSeek() {
    if (pendingTime === null || isSeeking) return;
    const t = pendingTime;
    pendingTime = null;
    isSeeking = true;
    video.currentTime = t;
  }

  video.addEventListener('seeked', () => {
    isSeeking = false;
    doSeek();
  });

  function requestSeek(t) {
    pendingTime = t;
    doSeek();
  }

  function handleMove(e) {
    const rect = stage.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const ratio = Math.min(Math.max(x / rect.width, 0), 1) * 2 - 1; // -1..1
    const absRatio = Math.abs(ratio);

    video.style.transform = 'scaleX(' + (ratio > 0 ? -1 : 1) + ')';
    requestSeek(absRatio * peakTime);
  }

  stage.addEventListener('mouseenter', () => {
    stage.classList.add('is-active');
  });

  stage.addEventListener('mousemove', handleMove);

  stage.addEventListener('mouseleave', () => {
    stage.classList.remove('is-active');
    video.style.transform = 'scaleX(1)';
    requestSeek(0);
  });
})();
</script>

</body>
</html>
